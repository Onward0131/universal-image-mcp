name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        shell: pwsh
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Run offline tests
        shell: pwsh
        run: npm test

      - name: Build release assets
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath release -File |
              Where-Object { $_.Name -match "\.zip(?:\.sha256)?$" } |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          if ($assets.Count -ne 2) {
              throw "Expected one ZIP and one ZIP SHA-256 file"
          }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes
